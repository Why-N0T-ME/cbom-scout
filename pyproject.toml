[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbom-scout"
version = "0.1.0"
description = "암호자산 자동 식별 도구: 소스코드·인증서·TLS 엔드포인트를 스캔해 CycloneDX 1.6 CBOM과 PQC 전환 리포트를 만든다"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=41"]
keywords = ["cbom", "cyclonedx", "post-quantum", "pqc", "crypto-agility", "inventory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18", "referencing"]

[project.scripts]
cbom-scout = "cbom_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbom_scout = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

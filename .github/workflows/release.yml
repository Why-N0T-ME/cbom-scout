name: Release

# Actions 탭에서 버튼으로 실행: 테스트 → 태그 생성 → GitHub 릴리스 → 주 버전 태그(v0) 갱신
on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (예: v0.1.0). docs/releases/<버전>.md 가 릴리스 설명으로 쓰인다"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 형식 확인
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 v1.2.3 형식이어야 합니다"; exit 1; }
          test -f "docs/releases/$VERSION.md" || { echo "::error::docs/releases/$VERSION.md 가 없습니다"; exit 1; }
          if git rev-parse "$VERSION" >/dev/null 2>&1; then echo "::error::$VERSION 태그가 이미 있습니다"; exit 1; fi
          pyver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$pyver" = "$VERSION" ] || echo "::warning::pyproject.toml 버전($pyver)과 릴리스 버전($VERSION)이 다릅니다"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" && python -m pytest -q

      - name: 태그와 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "cbom-scout $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "cbom-scout $VERSION" --notes-file "docs/releases/$VERSION.md" --verify-tag
          major="${VERSION%%.*}"
          git tag -fa "$major" -m "cbom-scout $major (→ $VERSION)"
          git push -f origin "$major"
